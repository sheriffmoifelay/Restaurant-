<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sheriff's Online Restaurant </title>
    <link rel="shortcut icon" href="Front 2.png" type="image/x-icon">
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        
        nav{
            width: 100%;
            height: 70px;
            text-align: center;
        }

        nav li{
            display: inline-block;
            margin: 10px;
        }

        nav button{
            padding: 7px;
            border: none;
            background-color: blue;
            border-radius: 15px;
            transition: 1s;
        }

        nav button:hover{
            background-color: rgb(23, 217, 243);
            transform: scale(1.1);
        }

        nav a{
            text-decoration: none;
            color: white;
            font-size: 30px;
            font-family: Arial, Helvetica, sans-serif;
            transition: 1s;
        }

        nav a:hover{
            color: rgb(7, 3, 243);
        }

        #homepage{
                width: 100%;
        }

        .main{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        h1{
            font-size: 55px;
            color: green;
            text-align: center;
        }

        .sub-main{
            width: 400px;
            height: 380px;
            text-align: center;
            margin: 10px;
        }

        .sub-main img{
            width: 400px;
            height: 350px;
            border-radius: 15px;
        }

        .sub-main b{
            font-size: 30px;
            font-family: Arial, Helvetica, sans-serif;
            color: deeppink;
        }

        .sub-main label{
            font-size: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
        }

        section{
            width: 100%;
            height: 50px;
            text-align: center;
        }

        section button{
            width: 500px;
            padding: 8px;
            background-color: blue;
            border-radius: 25px;
            border: none;
            transition: 1s;
        }

        section button:hover{
            background-color: rgb(235, 104, 174);
            transform: scale(1.1);
        }

        section button a{
            text-decoration: none;
            color: greenyellow;
            font-size: 25px;
            transition: 1s;
        }

        section button a:hover{
            color: white;
        }

        footer{
            width: 100%;
            height: 50px;
            background-color: black;
            text-align: center;
        }

        footer li{
            display: inline-block;
            margin: 15px;
            color: white;
            font-size: 20px;
        }

        @media screen and (min-width: 270px) and (max-width: 670px) {

            nav{
                height: 50px;
            }

            nav a{
                font-size: 20px;
            }

            #homepage{
                margin-left: 10px;
                width: 95%;
            }

            h1{
                font-size: 35px;
            }

            .sub-main{
                width: 320px;
                height: 350px;
                margin: 20px;
            }

            .sub-main img{
                width: 320px;
                height: 320px;
            }

            .sub-main b{
                font-size: 25px;
            }

            #invisible{
                display: none;
            }
            
            section{
                height: 100px;
            }
            
            section button{
                width: 250px;
                margin-top: 50px;
            }

            footer{
                height: 30px;
            }

            footer li{
                display: inline-block;
                margin: 5px;
                font-size: 15px;
            }

            #email{
                display: none;
            }
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>
                <button>
                    <a href="Menu.html"> View Menu </a>
                </button>
            </li>
            <li>
                <button>
                    <a href="Order.html"> Place Order </a>
                </button>
            </li>
        </ul>
    </nav>
    <img src="Homepage.png" alt="" id="homepage">
    <br><br><br>
    <h1> <u> Process Guides: </u> </h1>
    <div class="main">
        <div class="sub-main">
            <img src="Menu Select.png" alt="">
            <b> 1. </b>
            <label> Select Your Desire Menu </label>
        </div>
        <div class="sub-main">
            <img src="Menu Select 1.png" alt="">
            <b> 2. </b>
            <label> Place Your Order </label>
        </div>
        <div class="sub-main">
            <img src="Call 1.png" alt="">
            <b> 3. </b>
            <label> Respond To Customer Service Call </label>
        </div>
        <div class="sub-main">
            <img src="Payment.png" alt="">
            <b> 4. </b>
            <label> Make Payment </label>
        </div>
        <div class="sub-main">
            <img src="Delivery Guy 1.png" alt="">
            <b> 5. </b>
            <label> Delivery Team Receives Your Order </label>
        </div>
        <div class="sub-main">
            <img src="Delivery Guy 2.png" alt="">
            <b> 6. </b>
            <label> Delivery Team Sets For Delivery </label>
        </div>
        <div class="sub-main">
            <img src="Delivery Guy 3.png" alt="">
            <b> 7. </b>
            <label> You Receive Your Order Satisfied </label>
        </div>
        <div class="sub-main" id="invisible"> </div>
        <div class="sub-main" id="invisible"> </div>
    </div>
    <section>
        <button title="Click to Place Your Order"> <a href="Order.html"> Place Your Order </a> </button>
    </section>
    <footer>
        <ul>
            <li> &copy Already Reserved </li>
            <li> +233 264 262 543 </li>
            <li> +233 533 480 202 </li>
            <li id="email"> sheriffmoifelay7@gmail.com </li>
            <li id="email"> khalifahsheriff7@gmail.com </li>
        </ul>
    </footer>
</body>
</html>
